name: keras-mlops

# Shared infrastructure, used by both parts. The per-part services live in
# compose.part1.yml / compose.part2.yml; .env lists them all in COMPOSE_FILE so a
# plain `docker compose ...` from the repo root sees every service.

services:

  # ---------------------------------------------------------------- tracking
  # Standalone, reusable MLflow: sqlite backend (needed for the Model Registry)
  # + plain-file artifacts. ./mlruns is mounted at the SAME path (/mlruns) in
  # every container, so artifact URIs resolve identically everywhere.
  mlflow-server:
    build: ./mlflow-server
    container_name: mlflow-server
    user: "${CONTAINER_UID:-1000}:${CONTAINER_GID:-1000}"
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns:z
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlruns/mlflow.db
      --default-artifact-root file:///mlruns/artifacts
      --no-serve-artifacts
      --allowed-hosts mlflow-server:5000,localhost:5000,127.0.0.1:5000
    healthcheck:
      # CMD-SHELL, not the exec form: the check is one quoted shell command, so the
      # python one-liner stays a single argument instead of being split on whitespace.
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 30

  # ---------------------------------------------------------------- database
  # Part 2 only, but defined here because three different services need it:
  # Label Studio's own store, the analyst verdicts, and the app's telemetry.
  # All of them share the one `public` schema; the four tables Part 2 adds are in
  # part2/pipeline/schema.sql and are named so as not to collide with Django's or Airflow's.
  # Runs as the default postgres uid, NOT ${CONTAINER_UID} — the official image
  # manages its own data dir ownership and fails if you override the user.
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    # "label" and "orchestrate" are listed too: compose refuses to start a service whose
    # depends_on target is not in an active profile, so either alone must pull postgres in.
    profiles: ["db", "part2", "label", "orchestrate"]
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-mlops}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-mlops}"
      POSTGRES_DB: "${POSTGRES_DB:-mlops}"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlops} -d ${POSTGRES_DB:-mlops}"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  # Named volume, not a host mount: Postgres needs uid-999 ownership, and a
  # ./ bind would fight the CONTAINER_UID convention used everywhere else.
  pgdata:
