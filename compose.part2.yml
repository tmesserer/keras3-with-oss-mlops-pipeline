# Part 2 — fraud detection, a consuming application, and humans in the loop.
# Merged on top of docker-compose.yml via COMPOSE_FILE in .env.

services:

  # ----------------------------------------------------------- fraud trainer
  # Same contract as Part 1's trainer: one run, config entirely from env, then exits.
  fraud-trainer:
    build:
      # Context is part2/ so the image can copy common/features.py, which the serving
      # image also copies. One definition, no training/serving skew.
      context: ./part2
      dockerfile: trainer/Dockerfile
    container_name: fraud-trainer
    profiles: ["part2", "tools2"]
    user: "${CONTAINER_UID:-1000}:${CONTAINER_GID:-1000}"
    restart: "no"
    depends_on:
      mlflow-server:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      KERAS_BACKEND: torch
      KERAS_HOME: /tmp/.keras
      HOME: /tmp
      # Same uid-without-passwd-entry workarounds as Part 1; see compose.part1.yml.
      USER: mlflow
      GIT_PYTHON_REFRESH: quiet
      EXPERIMENT: fraud-keras
      REGISTERED_MODEL: fraud-keras
      DATA_DIR: /data/fraud
      # The DVC-versioned snapshot from part2/pipeline/build_dataset.py, used when it exists.
      # Empty string forces the raw fraudTrain.csv path.
      SNAPSHOT: /data/derived/fraud_training.parquet
      RUN_NAME: "run"
      HIDDEN: "128,64"           # comma-separated dense widths
      DROPOUT: "0.3"
      LR: "1e-3"
      CLASS_WEIGHT: "balanced"   # balanced | none
      EPOCHS: "5"
      BATCH_SIZE: "2048"
      TRAIN_SUBSET: "0"          # 0 = all 1.3M rows; set e.g. 200000 for a quick pass
      VAL_FRACTION: "0.1"        # tail of train, by time
      TARGET_PRECISION: "0.90"   # the operating point the threshold is chosen for
    volumes:
      - ./mlruns:/mlruns:z
      - ./data:/data:z

  # --------------------------------------------------------------- inference
  # Serves models:/fraud-keras@champion and turns probabilities into decisions.
  # Port 8001, because Part 1's api-serve owns 8000 and both can run at once.
  fraud-serve:
    build:
      context: ./part2
      dockerfile: serving/Dockerfile
    container_name: fraud-serve
    profiles: ["part2", "serve2"]
    user: "${CONTAINER_UID:-1000}:${CONTAINER_GID:-1000}"
    ports:
      - "8001:8001"
    depends_on:
      mlflow-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      KERAS_BACKEND: torch
      KERAS_HOME: /tmp/.keras
      HOME: /tmp
      USER: mlflow
      GIT_PYTHON_REFRESH: quiet
      MODEL_URI: models:/fraud-keras@champion
      POSTGRES_DSN: "postgresql://${POSTGRES_USER:-mlops}:${POSTGRES_PASSWORD:-mlops}@postgres:5432/${POSTGRES_DB:-mlops}"
      # Both empty = inherit the operating point the trainer chose and tagged on the run.
      # Set either to a number to override and watch the app's decision mix shift.
      DECLINE_THRESHOLD: ""
      REVIEW_THRESHOLD: ""
      REVIEW_SPAN: "0.5"       # review band starts at decline * this, when not set explicitly
    volumes:
      - ./mlruns:/mlruns:z
      - ./data:/data:z
      - ./inference:/inference:z
    healthcheck:
      # CMD-SHELL for the reason given in docker-compose.yml: Podman splits exec-form args.
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ------------------------------------------------------------- consumer app
  # Replays fraudTest.csv against fraud-serve and has to cope with whatever it gets.
  # Dashboard on :5500. Depends on the endpoint being *reachable*, not healthy --
  # starting while the model is still loading is a case it must survive.
  txn-app:
    build:
      context: ./part2
      dockerfile: app/Dockerfile
    container_name: txn-app
    profiles: ["part2", "app"]
    user: "${CONTAINER_UID:-1000}:${CONTAINER_GID:-1000}"
    ports:
      - "5500:5500"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SCORE_URL: http://fraud-serve:8001
      POSTGRES_DSN: "postgresql://${POSTGRES_USER:-mlops}:${POSTGRES_PASSWORD:-mlops}@postgres:5432/${POSTGRES_DB:-mlops}"
      RATE: "5"                  # transactions per second, adjustable from the dashboard
      REQUEST_TIMEOUT: "2.0"     # seconds to wait for a score before giving up
      RETRIES: "2"               # total attempts per transaction
      # The business decision: what to do with a transaction that could not be scored.
      # 'approve' loses money to fraud, 'decline' rejects good customers, 'review'
      # defers to a human and costs analyst time. There is no free option.
      FALLBACK_DECISION: "review"
      BREAKER_THRESHOLD: "5"     # consecutive failures before the circuit opens
      BREAKER_COOLDOWN: "10"     # seconds before a probe is allowed through
    volumes:
      - ./data:/data:z

  # ------------------------------------------------------------ review queue
  # Label Studio CE, the open-source review UI (the original plan named Labelbox, which has no
  # self-hostable server -- see section E of the notebook). Shares the one Postgres and keeps
  # its own Django tables in it, alongside the three in part2/pipeline/schema.sql.
  #
  # NOT run as ${CONTAINER_UID}: like postgres, the image fixes ownership of its own data dir
  # on boot and fails when the user is overridden. Hence a named volume, not a bind mount.
  label-studio:
    image: heartexlabs/label-studio:1.16.0
    container_name: label-studio
    profiles: ["part2", "label"]
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DJANGO_DB: default
      POSTGRE_NAME: "${POSTGRES_DB:-mlops}"
      POSTGRE_USER: "${POSTGRES_USER:-mlops}"
      POSTGRE_PASSWORD: "${POSTGRES_PASSWORD:-mlops}"
      POSTGRE_HOST: postgres
      POSTGRE_PORT: "5432"
      LABEL_STUDIO_HOST: "http://localhost:8080"
      # Bootstrapped on first boot only. The token is what label-sync authenticates with,
      # so it is fixed rather than generated -- a learning box, not a shared deployment.
      LABEL_STUDIO_USERNAME: "${LS_USERNAME:-analyst@example.com}"
      LABEL_STUDIO_PASSWORD: "${LS_PASSWORD:-analyst123}"
      LABEL_STUDIO_USER_TOKEN: "${LS_TOKEN:-fraud-review-local-token-0001}"
      LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK: "true"
    volumes:
      - lsdata:/label-studio/data
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 90s

  # --------------------------------------------------------------- label sync
  # Both directions of the loop: review-band scores out as tasks, verdicts back into
  # Postgres via Label Studio's webhook. No ML dependency, same as txn-app.
  label-sync:
    build:
      context: ./part2
      dockerfile: labeling/Dockerfile
    container_name: label-sync
    profiles: ["part2", "label"]
    user: "${CONTAINER_UID:-1000}:${CONTAINER_GID:-1000}"
    ports:
      - "8002:8002"
    networks:
      default:
        # Label Studio validates webhook URLs with Django's URLValidator, which rejects a
        # bare hostname -- "http://label-sync:8002/..." comes back as "Enter a valid URL."
        # A dotted alias on the same compose network is the smallest fix.
        aliases: ["label-sync.local"]
    depends_on:
      postgres:
        condition: service_healthy
      label-studio:
        condition: service_healthy
    environment:
      POSTGRES_DSN: "postgresql://${POSTGRES_USER:-mlops}:${POSTGRES_PASSWORD:-mlops}@postgres:5432/${POSTGRES_DB:-mlops}"
      LABEL_STUDIO_URL: http://label-studio:8080
      LABEL_STUDIO_TOKEN: "${LS_TOKEN:-fraud-review-local-token-0001}"
      LS_PROJECT_TITLE: "Fraud review queue"
      # Label Studio calls this back, so it must resolve from inside ITS container -- and
      # must be dotted, see the network alias above.
      WEBHOOK_URL: http://label-sync.local:8002/webhook
      PUSH_INTERVAL: "30"        # seconds between sweeps of the review band
      PUSH_BATCH: "50"           # tasks per sweep, so a backlog arrives in chunks

  # ------------------------------------------------------------ orchestration
  # Airflow arrives LAST and automates nothing new: every task in part2/airflow/dags wraps a
  # command sections A-F of part2/notebooks/hub.ipynb already proved by hand. It starts a sibling
  # fraud-trainer container through the host's engine socket rather than training in-process,
  # so the training environment stays defined in exactly one image.
  #
  # NOT run as ${CONTAINER_UID}: like postgres and label-studio, the image owns its own
  # directories (uid 50000, group 0). Socket access comes from the supplementary group instead.
  airflow:
    build:
      context: ./part2
      dockerfile: airflow/Dockerfile
    container_name: airflow
    profiles: ["part2", "orchestrate"]
    ports:
      - "8090:8080"          # 8080 belongs to Label Studio; both run at once
    group_add:
      # The gid that owns the engine socket on the host -- `stat -c %g $DOCKER_SOCK`.
      # Without it DockerOperator gets "permission denied" on the socket.
      - "${DOCKER_SOCK_GID:-986}"
    depends_on:
      mlflow-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      # Airflow's metadata tables share the one Postgres, same as Label Studio's Django
      # tables. Different table names, no schema juggling, one database to back up.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${POSTGRES_USER:-mlops}:${POSTGRES_PASSWORD:-mlops}@postgres:5432/${POSTGRES_DB:-mlops}"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      # No login on a laptop-local orchestrator. Everyone who can reach :8090 is an admin;
      # this is the one setting to revisit if this ever leaves the machine.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      SERVE_URL: http://fraud-serve:8001
      LABEL_SYNC_URL: http://label-sync:8002
      SNAPSHOT: /data/derived/fraud_training.parquet
      # What the DAG hands to the trainer it launches. The rest of that container's config
      # is restated in the DAG itself -- compose cannot export a service's env to a sibling.
      # Both come from .env so a different engine or project name can be pointed at the right
      # image and network. Podman answers to this bare name; a localhost/ prefix would make it
      # try to pull from a registry called localhost.
      TRAINER_IMAGE: "${TRAINER_IMAGE:-keras-mlops-fraud-trainer:latest}"
      DOCKER_NETWORK: "${DOCKER_NETWORK:-keras-mlops_default}"
      CONTAINER_UID: "${CONTAINER_UID:-1000}"
      CONTAINER_GID: "${CONTAINER_GID:-1000}"
      DAG_EPOCHS: "5"
      DAG_TRAIN_SUBSET: "0"      # 0 = all rows; set e.g. 200000 for a fast end-to-end demo
      # Bind sources for the trainer are resolved by the daemon on the HOST, so the DAG needs
      # the host path. Compose is always run from the repo root (see COMPOSE_FILE in .env).
      HOST_REPO_DIR: "${PWD}"
    volumes:
      - ./part2/airflow/dags:/opt/airflow/dags:ro,z
      - ./data:/data:ro,z        # read-only: this service verifies the snapshot, never writes it
      - ./mlruns:/mlruns:ro,z    # only to check a model version's artifacts exist before promoting
      # The engine's socket. Docker's lives at /var/run/docker.sock; Podman's rootful socket
      # is /run/podman/podman.sock. The path INSIDE stays the same, so the DAG never changes.
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      - airflow-logs:/opt/airflow/logs
    command: ["airflow", "standalone"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health')\""]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s

volumes:
  lsdata:
  airflow-logs:
