# Part 1 — the MNIST loop. Frozen: this file and part1/ should not need to change
# as Part 2 grows. Merged on top of docker-compose.yml via COMPOSE_FILE in .env.

services:

  # ----------------------------------------------------------------- trainer
  # Trains ONE model and exits. Every hyperparameter below is a default that
  # the notebook overrides with -e when it launches the container.
  trainer:
    build: ./part1/trainer
    container_name: trainer
    profiles: ["tools"]
    user: "${CONTAINER_UID:-1000}:${CONTAINER_GID:-1000}"
    restart: "no"
    depends_on:
      mlflow-server:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      KERAS_BACKEND: torch
      KERAS_HOME: /tmp/.keras
      HOME: /tmp
      # The container runs as uid 1000 with no /etc/passwd entry, so MLflow's
      # getpass.getuser() would fail; USER short-circuits that lookup. And the
      # image has no git, so stop GitPython printing a page about it.
      USER: mlflow
      GIT_PYTHON_REFRESH: quiet
      EXPERIMENT: mnist-keras
      REGISTERED_MODEL: mnist-keras
      RUN_NAME: "run"            # MLflow run name
      KIND: "mlp"                # mlp | cnn
      SIZE: "128"                # mlp hidden units / cnn conv filters
      DROPOUT: "0.2"
      OPT: "adam"                # adam | sgd
      LR: "1e-3"
      EPOCHS: "3"
      BATCH_SIZE: "128"
      TRAIN_SUBSET: "0"          # 0 = the full 60k; the slides and the diagram say 60k
    volumes:
      - ./mlruns:/mlruns:z
      - ./data:/data:z

  # --------------------------------------------------------------- inference
  # You trigger this: docker compose --profile serve up -d api-serve
  api-serve:
    build: ./part1/api-serve
    container_name: api-serve
    profiles: ["serve"]
    user: "${CONTAINER_UID:-1000}:${CONTAINER_GID:-1000}"
    ports:
      - "8000:8000"
    depends_on:
      mlflow-server:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      KERAS_BACKEND: torch
      KERAS_HOME: /tmp/.keras
      HOME: /tmp
      USER: mlflow
      GIT_PYTHON_REFRESH: quiet
      MODEL_URI: models:/mnist-keras@champion
    volumes:
      - ./mlruns:/mlruns:z
      - ./inference:/inference:z
      - ./data:/data:z
    command: uvicorn app:app --host 0.0.0.0 --port 8000
