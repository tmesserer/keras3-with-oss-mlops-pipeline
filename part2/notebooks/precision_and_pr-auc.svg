<text class="note" x="102" y="223.6">cut every score at 0.9968,</text>
<text class="note" x="102" y="238.4">and 70% of the fraud is still caught</text>
<text class="item" x="52" y="602">You do not choose precision and recall. You choose one,</text>
<text class="item" x="52" y="620">and the curve hands you the other.</text>
<text class="note" x="52" y="640">Every white dot is one value of TARGET_PRECISION. The trainer keeps</text>
<text class="note" x="52" y="654">the highest recall that still holds it. A better model lifts the whole curve;</text>
<text class="note" x="52" y="668">a different target only slides you along the curve you have.</text>
