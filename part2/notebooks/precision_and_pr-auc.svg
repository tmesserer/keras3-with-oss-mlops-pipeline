<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 740" width="1180" height="740"
     font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img"
     aria-label="Part 2, choosing the target precision: the validation precision-recall curve with its operating points on the left, and on the right the precision, recall, alert count and missed-fraud count each target produces on the held-out test file.">
  <style>
    .surface { fill: #fcfcfb; }
    .card    { fill: #ffffff; stroke: #d8d7d0; stroke-width: 1.2; }
    .h1      { fill: #0b0b0b; font-size: 17px; font-weight: 650; }
    .h2      { fill: #52514e; font-size: 12px; }
    .title   { fill: #0b0b0b; font-size: 12.5px; font-weight: 650; letter-spacing: .04em; }
