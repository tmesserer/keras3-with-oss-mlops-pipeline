    .item    { fill: #52514e; font-size: 11px; }
    .tick    { fill: #898781; font-size: 10px; }
    .note    { fill: #898781; font-size: 9.5px; }
    .axis    { stroke: #c3c2b7; stroke-width: 1.2; fill: none; }
    .grid    { stroke: #e1e0d9; stroke-width: 1; }
    .guide   { stroke: #898781; stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
    .target  { stroke: #898781; stroke-width: 1.6; stroke-dasharray: 5 4; fill: none; }
    .c1      { stroke: #2a78d6; stroke-width: 2; fill: none; }
    .c2      { stroke: #eb6834; stroke-width: 2; fill: none; }
    .f1      { fill: #2a78d6; }
    .f2      { fill: #eb6834; }
    .fill1   { fill: #2a78d6; opacity: .10; }
    .dot1    { fill: #2a78d6; stroke: #ffffff; stroke-width: 2; }
    .dot2    { fill: #eb6834; stroke: #ffffff; stroke-width: 2; }
    .op      { fill: #ffffff; stroke: #52514e; stroke-width: 1.6; }
    .opnow   { fill: #eb6834; stroke: #ffffff; stroke-width: 2; }
    .lbl1    { fill: #2a78d6; font-size: 10.5px; font-weight: 650; }
    .lbl2    { fill: #eb6834; font-size: 10.5px; font-weight: 650; }
    .val     { fill: #0b0b0b; font-size: 10px; font-weight: 650; }
    .code    { fill: #0b0b0b; font-size: 11px; font-weight: 650; }
    .now     { fill: #eb6834; font-size: 10.5px; font-weight: 650; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .card    { fill: #232322; stroke: #3a3a37; }
      .h1, .title, .code, .val { fill: #ffffff; }
      .h2, .item, .sub { fill: #c3c2b7; }
      .tick, .note { fill: #a3a199; }
      .axis  { stroke: #4a4a46; }
      .grid  { stroke: #33332f; }
      .guide, .target { stroke: #a3a199; }
      .c1 { stroke: #3987e5; } .f1 { fill: #3987e5; } .lbl1 { fill: #3987e5; }
      .c2 { stroke: #d95926; } .f2 { fill: #d95926; } .lbl2, .now { fill: #d95926; }
      .fill1 { fill: #3987e5; opacity: .14; }
      .dot1 { fill: #3987e5; stroke: #232322; }
      .dot2 { fill: #d95926; stroke: #232322; }
      .op   { fill: #232322; stroke: #c3c2b7; }
      .opnow { fill: #d95926; stroke: #232322; }
    }
  </style>
