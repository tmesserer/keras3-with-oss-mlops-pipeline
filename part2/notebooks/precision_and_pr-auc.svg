  <text class="h1" x="30" y="38">Part 2 — what the target precision buys, and what it costs</text>
  <text class="h2" x="30" y="58">The model is one curve. <tspan class="code">TARGET_PRECISION</tspan> only says where on that curve you stand.</text>

